# Bagisto eğitimi — yerel geliştirme ortamı.
# Kurulum ve yönetim: ./kur.sh (ayrıntılar README.md'de).
# Değişkenler .env dosyasından okunur (şablon: .env.example).

name: bagisto-egitimi

x-php: &php
  image: ${PHP_IMAGE:-bagisto-egitimi/php}:${PHP_VERSION:-8.4}
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  working_dir: /var/www/html
  volumes:
    - ./bagisto:/var/www/html
    - composer-cache:/opt/cache/composer
    - npm-cache:/opt/cache/npm
  environment:
    XDEBUG_MODE: ${XDEBUG_MODE:-off}
  extra_hosts:
    - host.docker.internal:host-gateway
  # PID 1 olarak küçük bir init süreci çalışır; PHP süreçleri durdurma sinyallerini alır.
  init: true
  restart: unless-stopped

x-php-depends: &php-depends
  mysql:
    condition: service_healthy
  redis:
    condition: service_healthy
  elasticsearch:
    condition: service_started
  mailpit:
    condition: service_started

services:
  # PHP-FPM: Bagisto uygulaması.
  app:
    <<: *php
    depends_on: *php-depends

  # Kuyruk işçisi. queue:listen her işi yeni bir süreçte çalıştırır, böylece kod değişiklikleri
  # yeniden başlatma gerektirmeden işçiye yansır (production'da queue:work kullanılır).
  # stop_signal: PHP-FPM imajının varsayılanı SIGQUIT'tir; artisan süreçleri SIGTERM ile düzgün kapanır.
  queue:
    <<: *php
    command: php artisan queue:listen --queue=default,broadcastable --tries=3 --timeout=0
    stop_signal: SIGTERM
    depends_on: *php-depends

  # Zamanlayıcı: production'daki dakikalık cron satırının geliştirme karşılığı.
  scheduler:
    <<: *php
    command: php artisan schedule:work
    stop_signal: SIGTERM
    depends_on: *php-depends

  web:
    image: nginx:1.28-alpine
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./bagisto:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  mysql:
    image: mysql:${MYSQL_VERSION:-8.4}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bagisto
      MYSQL_USER: bagisto
      MYSQL_PASSWORD: bagisto
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--host=127.0.0.1", "--user=root", "--password=root", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTICSEARCH_VERSION:-8.19.21}
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms${ELASTICSEARCH_HEAP:-512m} -Xmx${ELASTICSEARCH_HEAP:-512m}"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${FORWARD_ES_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # Gönderilen tüm e-postaları yakalar; arayüz: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    restart: unless-stopped

  # Veritabanını tarayıcıdan incelemek için: http://localhost:8081
  phpmyadmin:
    image: phpmyadmin:5.2
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 256M
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    depends_on:
      - mysql
    restart: unless-stopped

  # İsteğe bağlı: Elasticsearch indekslerini incelemek için. Başlatma:
  #   docker compose --profile kibana up -d kibana
  kibana:
    profiles: [kibana]
    image: docker.elastic.co/kibana/kibana:${ELASTICSEARCH_VERSION:-8.19.21}
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    depends_on:
      - elasticsearch

  # İsteğe bağlı: tema geliştirirken Vite sıcak yenileme. Başlatma:
  #   docker compose --profile vite up vite                    (Shop paketi)
  #   VITE_PAKET=Admin docker compose --profile vite up vite   (Admin paketi)
  vite:
    <<: *php
    profiles: [vite]
    restart: "no"
    # SIGTERM ile Vite kapanırken public/*-vite.hot dosyasını siler (SIGQUIT'te silmez).
    stop_signal: SIGTERM
    working_dir: /var/www/html/packages/Webkul/${VITE_PAKET:-Shop}
    command: ["vite-dev"]
    environment:
      VITE_HOST: localhost
      VITE_PORT: "${VITE_PORT:-5173}"
      VITE_PROXY_PORT: "5174"
    ports:
      - "${VITE_PORT:-5173}:5174"

volumes:
  mysql-data:
  redis-data:
  elasticsearch-data:
  composer-cache:
  npm-cache:
