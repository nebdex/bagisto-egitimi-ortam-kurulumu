; Bagisto eğitimi — PHP-FPM havuz ayarları (geliştirme).
[www]
pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
request_terminate_timeout = 300

; Konteynerin ortam değişkenleri (ör. XDEBUG_MODE) PHP işçilerine geçsin.
clear_env = no

catch_workers_output = yes
decorate_workers_output = no
