; Bagisto eğitimi — geliştirme ortamı PHP ayarları.
; Değerler Bagisto'nun resmî production imajındaki php.ini'den alındı; OPcache geliştirme için
; her istekte dosya değişikliğini denetleyecek şekilde ayarlandı.

memory_limit = 512M
upload_max_filesize = 100M
post_max_size = 110M
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000

realpath_cache_size = 4096K
realpath_cache_ttl = 600

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Xdebug kurulu ama kapalı. Açmak için kök klasördeki .env içinde XDEBUG_MODE=debug yapın.
; Xdebug, XDEBUG_MODE ortam değişkenini bu ayarın önünde okur.
xdebug.mode = off
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.start_with_request = trigger
