# Bagisto eğitimi — Nginx (geliştirme).
# Bagisto'nun resmî production imajındaki nginx.conf temel alındı; geliştirmede sorun çıkaran
# uzun süreli önbellek başlıkları ve yinelenen güvenlik başlıkları çıkarıldı.

server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    client_max_body_size 110M;

    # app konteyneri yeniden oluşturulup IP'si değişse de Nginx onu yeniden bulsun.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream app:9000;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Diskte karşılığı olmayan statik yollar (ör. /cache/... görsel yeniden boyutlandırma)
    # uygulamaya gider.
    location ~* \.(js|css|map|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        try_files $uri /index.php?$query_string;
        access_log off;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass $php_upstream;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;

        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 32k;
        fastcgi_read_timeout 300s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
